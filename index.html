<!DOCTYPE html>
<html lang="en">
<head> <!-- Init -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koalas to the Max - Tailwind Rebuild</title>
    <!-- Tailwind-->
    <link rel="stylesheet" href="./tailwind.css">
    <link rel="stylesheet" href="./style.css?v=5">
    <!-- D3.js Library -->
    <script src="./vendor/d3.min.js"></script>
</head>
<body class="bg-pink-900 text-white flex justify-center items-center min-h-screen overflow-hidden select-none">

    <div id="game-title" class="absolute top-20 inset-x-0 z-[60] mb-4 px-4 text-center text-lg font-semibold leading-relaxed text-white drop-shadow-lg sm:text-xl md:text-2xl">
        <p>Play the game by dragging and dropping an image or clicking to select a file.</p>
        <p>Click on the image to reveal more!</p>
    </div>

    <div id="game-layout">
        <div id="progress-container" class="hidden-fade" aria-label="Game progress">
            <div id="progress-label" class="text-sm font-semibold">
                <span>Progress</span>
                <span>Time: <span id="game-timer">00:00</span></span>
                <span id="progress-text">0%</span>
            </div>
            <div id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Image revealed">
                <div id="progress-bar"></div>
            </div>
        </div>

        <!-- Main Game Area -->
        <div id="game-container" class="w-[80vmin] h-[80vmin] max-w-[800px] max-h-[800px] relative bg-gray-800 shadow-2xl overflow-hidden">
            <svg id="canvas" class="w-full h-full block"></svg>
        </div>
    </div>

    <!-- Drag & Drop Upload Pop up -->
    <div id="drop-zone" class="fixed inset-0 bg-purple-700 backdrop-blur-sm flex justify-center items-center z-50 transition-all duration-300">
        <div id="drop-content" class="bg-purple-300 border-4 border-dashed border-blue-800 rounded-3xl p-16 text-center pointer-events-none transition-colors duration-300">
            <span class="text-6xl mb-4 block">📁</span>
            <h2 class="text-white-400 text-3xl font-bold mb-2">Drop an image here</h2>
            <p class="text-white-400 text-lg">or click to select a file</p>
        </div>
        <input type="file" id="file-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
    </div>

    <!-- Win Pop up -->
    <div id="congrats-modal" class="hidden-fade fixed inset-0 bg-black/80 backdrop-blur-md flex justify-center items-center z-[100] transition-all duration-500">
        <div class="bg-gray-800 p-10 rounded-2xl text-center shadow-2xl border border-gray-700">
            <h2 class="text-4xl font-bold mb-4">🎉 Congratulations!</h2>
            <p class="text-gray-400 text-lg mb-8">You've uncovered the entire image.</p>
            <button id="reset-btn" class="px-8 py-3 text-lg font-bold bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-all hover:scale-105 shadow-lg shadow-blue-500/30">
                Play Again
            </button>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
